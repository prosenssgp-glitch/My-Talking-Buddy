plugins { id 'com.android.application' }

android {
    namespace 'com.prosen.ishanbuddy'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile file(System.getProperty("user.home") + "/.android/ishan-debug.keystore")
            storePassword "ishan-debug-only"
            keyAlias "ishan-debug"
            keyPassword "ishan-debug-only"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    defaultConfig {
        applicationId 'com.prosen.ishanbuddy'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '1.0.1'
    }
}
